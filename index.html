<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>特别的惊喜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen">
        <div class="content">
            <h1>准备好接受惊喜了吗？</h1>
            <p style="font-size: 0.9rem; margin-bottom: 20px; opacity: 0.8;">建议调大音量</p>
            <button id="start-btn">开始欣赏</button>
        </div>
    </div>

    <div id="gallery-container">
        <img src="photo1.jpg" class="gallery-img active" alt="美好回忆1">
        <img src="photo2.jpg" class="gallery-img" alt="美好回忆2">
        <img src="photo3.jpg" class="gallery-img" alt="美好回忆3">
        </div>

    <canvas id="canvas"></canvas>

    <audio id="bgm" loop preload="auto">
        <source src="love.flac" type="audio/flac">
        您的浏览器不支持音频播放。
    </audio>

    <script src="script.js"></script>
</body>
</html>
