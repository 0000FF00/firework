<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为特别的你准备的烟花</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen">
        <div class="content">
            <h1>准备好接受惊喜了吗？</h1>
            <button id="start-btn">开始欣赏</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="gallery-container">
        <img src="photo1.jpg" class="gallery-img active" alt="回忆">
        <img src="photo2.jpg" class="gallery-img" alt="回忆">
        <img src="photo3.jpg" class="gallery-img" alt="回忆">
        <img src="photo4.jpg" class="gallery-img" alt="回忆">
        <img src="photo5.jpg" class="gallery-img" alt="回忆">
        <img src="photo6.jpg" class="gallery-img" alt="回忆">
        <img src="photo7.jpg" class="gallery-img" alt="回忆">
        <img src="photo8.jpg" class="gallery-img" alt="回忆">
        <img src="photo9.jpg" class="gallery-img" alt="回忆">
        <img src="photo10.jpg" class="gallery-img" alt="回忆">
        <img src="photo11.jpg" class="gallery-img" alt="回忆">
        <img src="photo12.jpg" class="gallery-img" alt="回忆">
        <img src="photo13.jpg" class="gallery-img" alt="回忆">
        <img src="photo14.jpg" class="gallery-img" alt="回忆">
        <img src="photo15.jpg" class="gallery-img" alt="回忆">
        <img src="photo16.jpg" class="gallery-img" alt="回忆">
        <img src="photo17.jpg" class="gallery-img" alt="回忆">
        <img src="photo18.jpg" class="gallery-img" alt="回忆">
        </div>

    <audio id="bgm" loop preload="auto">
        <source src="love.flac" type="audio/flac">
        您的浏览器不支持音频播放。
    </audio>

    <!-- 红包互动模块 -->
    <div id="red-packet-container">
        <div id="red-packet-box">
            <div class="packet-outer"></div>
            <div class="packet-inner"></div>
            <div class="packet-text">点击打开</div>
            <div class="packet-shine"></div>
        </div>
    </div>

    <!-- 红包打开后显示的内容 -->
    <div id="packet-content-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="packet-opened"></div>
            <h2>恭喜获得兑换码</h2>
            <div class="code-display">ZW9986321</div>
            <p class="tips">前往微信向0000FF00兑换吧！</p>
            <button id="close-modal-btn">再开一个</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
